[package]
name = "aniverse-media-transfer"
version = "0.1.0"
edition = "2021"
publish = false

[features]
isolated-test = []

[dependencies]
aniverse-security = { path = "../security" }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "fs", "io-util", "net", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

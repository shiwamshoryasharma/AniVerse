[package]
name = "aniverse2"
version = "3.0.2"
edition = "2021"
publish = false

[features]
isolated-test = ["aniverse-desktop-migration?/test-signers"]
installer-handoff = ["dep:aniverse-desktop-migration", "dep:dirs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aniverse-desktop-migration = { path = "../desktop-migration", optional = true }
dirs = { version = "7", optional = true }
chrono = "0.4"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.7", features = ["custom-protocol"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

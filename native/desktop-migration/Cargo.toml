[package]
name = "aniverse-desktop-migration"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-signers = []

[dependencies]
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
tempfile = "3"
thiserror = "2"

[[test]]
name = "staging"
path = "../../test/tauri-compat/staging.rs"

[[test]]
name = "profile"
path = "../../test/tauri-compat/profile.rs"

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.23.1"
hex = "0.4.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
uuid = { version = "1", features = ["serde"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

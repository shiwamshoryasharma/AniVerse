name: Feature request
description: Suggest an idea for AniVerse
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like, and why?
      description: Describe the problem or the use case first, then the idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: rules
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a request to add, support or link specific streaming websites.
          required: true
